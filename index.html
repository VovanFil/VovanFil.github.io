<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Gaming</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      color: #eaeaea;
      text-align: center;
    }
    main { padding: 2rem; }
    h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
    p { color: #b8c1d1; }
    .game {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 1rem 2rem;
      border: 1px solid #3a4b6b;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
    }
    .game h2 { margin: 0 0 0.3rem; font-size: 1.3rem; color: #e0c068; }
    .game p { margin: 0; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Master Gaming</h1>
    <p>Independent mobile game development</p>
    <div class="game">
      <h2>One Tap Guardian</h2>
      <p>A one-tap arcade defense game for Android</p>
    </div>
  </main>
</body>
</html>
